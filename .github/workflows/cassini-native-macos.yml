# Build the Cassini macOS C API library natively on each architecture with the
# same scripts/build-native.sh as sherpa-onnx-go-linux, match upstream's
# install name, rpath, deployment target and ad-hoc signature, then probe it
# through the stock Go wrapper on the runner. ONNX Runtime stays upstream's.
name: Cassini native macOS

on:
  workflow_dispatch:
  push:
    branches: [v1.13.7-cassini]
    paths:
      - .github/workflows/cassini-native-macos.yml
      - scripts/build-native.sh
      - scripts/cassini-probe/**

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            triple: aarch64-apple-darwin
            minos: "11.0"
          - runner: macos-15-intel
            arch: x86_64
            triple: x86_64-apple-darwin
            minos: "10.15"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      OUT: /tmp/cassini-native/out
      WORK: /tmp/cassini-native/work
      MODELS: /tmp/cassini-models
      LC_ALL: C
      LIB: lib/${{ matrix.triple }}/libsherpa-onnx-c-api.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build libsherpa-onnx-c-api.dylib
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          CASSINI_NATIVE_BUILD_JOBS=$(sysctl -n hw.ncpu) scripts/build-native.sh cpu "$OUT" "$WORK" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.minos }}
          cat "$OUT/cassini-native-buildinfo.txt"

      - name: Match upstream install name, rpath and signature
        run: |
          lib=$OUT/libsherpa-onnx-c-api.dylib
          install_name_tool -id @rpath/libsherpa-onnx-c-api.dylib "$lib"
          for p in $(otool -l "$lib" | awk '/cmd LC_RPATH/{getline; getline; print $2}'); do
            [ "$p" = @loader_path ] || install_name_tool -delete_rpath "$p" "$lib"
          done
          otool -l "$lib" | grep -q 'path @loader_path ' || install_name_tool -add_rpath @loader_path "$lib"
          codesign --force --sign - "$lib"
          codesign --verify --verbose "$lib"
          shasum -a 256 "$OUT"/*.dylib

      - name: Check linkage
        run: |
          lib=$OUT/libsherpa-onnx-c-api.dylib
          otool -L "$lib" | tee "$OUT/otool-L.txt"
          otool -l "$lib" > "$OUT/otool-l.txt"
          lipo -archs "$lib" | tee /dev/stderr | grep -qx "${{ matrix.arch }}"
          deps=$(otool -L "$lib" | tail -n +2 | awk '{print $1}' | sort | tr '\n' ' ')
          test "$deps" = "/usr/lib/libSystem.B.dylib /usr/lib/libc++.1.dylib @rpath/libonnxruntime.dylib @rpath/libsherpa-onnx-c-api.dylib "
          rpaths=$(otool -l "$lib" | awk '/cmd LC_RPATH/{getline; getline; print $2}' | tr '\n' ' ')
          test "$rpaths" = "@loader_path "
          minos=$(otool -l "$lib" | awk '/cmd LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "minos $minos"
          test "$minos" = "${{ matrix.minos }}"
          grep -aq '1.13.7+cassini-parakeet-v3-reference-v1.nemotron-diarization-v2.parakeet-ultra-v1' "$lib"
          # ONNX Runtime stays upstream's; report whether the pinned archive matches it.
          if cmp "$OUT/libonnxruntime.dylib" lib/${{ matrix.triple }}/libonnxruntime.dylib; then
            echo "pinned ONNX Runtime is byte-identical to upstream's"
          else
            echo "pinned ONNX Runtime differs from upstream's; upstream's is kept"
            shasum -a 256 "$OUT/libonnxruntime.dylib" lib/${{ matrix.triple }}/libonnxruntime.dylib
          fi

      - name: Fetch pinned models and sample
        run: |
          fetch() { curl --fail --location --retry 3 -o "$2" "$1"; echo "$3  $2" | shasum -a 256 -c -; }
          v3=https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/2bda32ec70b097a55adaa07d9a7173915b43cc78
          ultra=https://huggingface.co/tpmaerk/parakeet-ultra-sherpa-onnx-int8/resolve/b86784a3a5356cbd126f710b61cd90c5fe5898f1
          mkdir -p "$MODELS/v3-int8" "$MODELS/ultra-int8"
          fetch $v3/test_wavs/en.wav "$MODELS/en.wav" 148b936b43ce7c546a866e64da059f0458aee2d65e617f16e9d94f06e8d99ed6
          fetch $v3/encoder.int8.onnx "$MODELS/v3-int8/encoder.int8.onnx" acfc2b4456377e15d04f0243af540b7fe7c992f8d898d751cf134c3a55fd2247
          fetch $v3/decoder.int8.onnx "$MODELS/v3-int8/decoder.int8.onnx" 179e50c43d1a9de79c8a24149a2f9bac6eb5981823f2a2ed88d655b24248db4e
          fetch $v3/joiner.int8.onnx "$MODELS/v3-int8/joiner.int8.onnx" 3164c13fc2821009440d20fcb5fdc78bff28b4db2f8d0f0b329101719c0948b3
          fetch $v3/tokens.txt "$MODELS/v3-int8/tokens.txt" d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d
          # Original metadata: url "https://huggingface.co/moondream/parakeet-ultra (parakeet-tdt-0.6b-v3 architecture)".
          fetch $ultra/encoder.int8.onnx "$MODELS/ultra-int8/encoder.int8.onnx" f4d06712d32431b1718eceba2153c314ac4425e8fe708a3534f5e56c5ad53697
          fetch $ultra/decoder.int8.onnx "$MODELS/ultra-int8/decoder.int8.onnx" 94373c6405c8149d1c9d1e9862514e0e3e88dab1c7de18fac9d5df9c6ba5efdd
          fetch $ultra/joiner.int8.onnx "$MODELS/ultra-int8/joiner.int8.onnx" 8a71aaccfdba3d451775507a889afd2257d2e754463fd81095a8c8f290f924c2
          fetch $ultra/tokens.txt "$MODELS/ultra-int8/tokens.txt" d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d

      - name: Probe through the stock Go wrapper
        run: |
          cp "$OUT/libsherpa-onnx-c-api.dylib" "$LIB"
          cd scripts/cassini-probe
          CGO_ENABLED=1 go build -buildvcs=false -o "$OUT/cassini-probe" .
          "$OUT/cassini-probe" "$MODELS/en.wav" "$MODELS/v3-int8" "$MODELS/ultra-int8" 2>&1 | tee "$OUT/probe.log"
          grep -qx PASS "$OUT/probe.log"

      - uses: actions/upload-artifact@v4
        with:
          name: cassini-native-${{ matrix.triple }}
          path: |
            /tmp/cassini-native/out/libsherpa-onnx-c-api.dylib
            /tmp/cassini-native/out/libonnxruntime.dylib
            /tmp/cassini-native/out/cassini-native-buildinfo.txt
            /tmp/cassini-native/out/cassini-native-inputs.sha256
            /tmp/cassini-native/out/otool-L.txt
            /tmp/cassini-native/out/otool-l.txt
            /tmp/cassini-native/out/probe.log
          if-no-files-found: error
