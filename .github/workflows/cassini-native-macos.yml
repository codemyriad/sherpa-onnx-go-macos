# Build the Cassini macOS C API library with scripts/build-native.sh (pinned to
# codemyriad/sherpa-onnx v2.0.1-cassini-2), match upstream's install name,
# rpath, deployment target and ad-hoc signature, then check it.
#
# Both architectures build on the macos-15-intel runner: x86_64 natively, arm64
# cross-compiled with CMAKE_OSX_ARCHITECTURES=arm64 (Apple clang targets arm64
# from Intel; sherpa-onnx's cmake then pins the osx-arm64 ONNX Runtime). Hosted
# Apple silicon runners were not being acquired on 2026-10-28. The x86_64
# library is probed on the runner through the stock sherpa-onnx-go/v2 wrapper;
# the arm64 library gets structural checks and a cross-linked Go probe build.
#
# mode=probe-arm64 runs the same probes on an Apple silicon runner against the
# libraries committed at the dispatched ref (use it on a release tag).
name: Cassini native macOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: build (both architectures on macos-15-intel) or probe-arm64 (committed arm64 library on Apple silicon)
        type: choice
        options: [build, probe-arm64]
        default: build
      arm64_runner:
        description: GitHub-hosted arm64 macOS runner label for probe-arm64
        default: macos-latest
  push:
    branches: [v2.0.1-cassini]
    paths:
      - .github/workflows/cassini-native-macos.yml
      - scripts/build-native.sh
      - scripts/cassini-check-dylib.sh
      - scripts/cassini-fetch-models.sh
      - scripts/cassini-probe/**

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  MODELS: /tmp/cassini-models
  LC_ALL: C
  RUNTIME_VERSION: 2.0.1+cassini.parakeet-tdt-joiner-v1.nemotron-diarization-v2

jobs:
  build:
    if: github.event_name == 'push' || inputs.mode == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
            minos: "11.0"
            cross: true
          - arch: x86_64
            triple: x86_64-apple-darwin
            minos: "10.15"
            cross: false
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      OUT: /tmp/cassini-native/out
      WORK: /tmp/cassini-native/work
      LIB: lib/${{ matrix.triple }}/libsherpa-onnx-c-api.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build libsherpa-onnx-c-api.dylib
        run: |
          uname -m
          test "$(uname -m)" = x86_64
          CASSINI_NATIVE_BUILD_JOBS=$(sysctl -n hw.ncpu) scripts/build-native.sh cpu "$OUT" "$WORK" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.minos }}
          cat "$OUT/cassini-native-buildinfo.txt"

      - name: Match upstream install name, rpath and signature
        run: |
          lib=$OUT/libsherpa-onnx-c-api.dylib
          install_name_tool -id @rpath/libsherpa-onnx-c-api.dylib "$lib"
          for p in $(otool -l "$lib" | awk '/cmd LC_RPATH/{getline; getline; print $2}'); do
            [ "$p" = @loader_path ] || install_name_tool -delete_rpath "$p" "$lib"
          done
          otool -l "$lib" | grep -q 'path @loader_path ' || install_name_tool -add_rpath @loader_path "$lib"
          codesign --force --sign - "$lib"
          codesign --verify --verbose "$lib"
          shasum -a 256 "$OUT"/*.dylib

      - name: Check architecture, linkage, signature and symbols
        run: |
          lib=$OUT/libsherpa-onnx-c-api.dylib
          otool -L "$lib" > "$OUT/otool-L.txt"
          otool -l "$lib" > "$OUT/otool-l.txt"
          scripts/cassini-check-dylib.sh "$lib" ${{ matrix.arch }} ${{ matrix.minos }} "$RUNTIME_VERSION" 2>&1 | tee "$OUT/check.log"
          # ONNX Runtime stays upstream's; report whether the pinned archive matches it.
          lipo -archs "$OUT/libonnxruntime.dylib" | grep -qx ${{ matrix.arch }}
          shasum -a 256 "$OUT/libonnxruntime.dylib" lib/${{ matrix.triple }}/libonnxruntime.dylib | tee "$OUT/onnxruntime.sha256"
          if cmp "$OUT/libonnxruntime.dylib" lib/${{ matrix.triple }}/libonnxruntime.dylib; then
            echo "pinned ONNX Runtime is byte-identical to upstream's" | tee -a "$OUT/onnxruntime.sha256"
          else
            echo "pinned ONNX Runtime differs from upstream's; upstream's is kept" | tee -a "$OUT/onnxruntime.sha256"
          fi

      - name: Cross-link the Go probe for arm64
        if: matrix.cross
        run: |
          cp "$OUT/libsherpa-onnx-c-api.dylib" "$LIB"
          cd scripts/cassini-probe
          # Links the stock wrapper and this module's Go source against the
          # arm64 library; any C symbol the wrapper needs must resolve.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" \
            go build -buildvcs=false -o "$OUT/cassini-probe-arm64" .
          file "$OUT/cassini-probe-arm64" | tee "$OUT/probe-arm64-build.txt"
          lipo -archs "$OUT/cassini-probe-arm64" | grep -qx arm64
          otool -L "$OUT/cassini-probe-arm64" | tee -a "$OUT/probe-arm64-build.txt"
          echo "arm64 library cross-built on Intel: structural checks only, not run" | tee "$OUT/probe.log"

      - name: Fetch pinned production models and samples
        if: ${{ !matrix.cross }}
        run: scripts/cassini-fetch-models.sh "$MODELS"

      - name: Probe through the stock Go wrapper
        if: ${{ !matrix.cross }}
        run: |
          cp "$OUT/libsherpa-onnx-c-api.dylib" "$LIB"
          cd scripts/cassini-probe
          CGO_ENABLED=1 go build -buildvcs=false -o "$OUT/cassini-probe" .
          set -o pipefail
          "$OUT/cassini-probe" -wav "$MODELS/en.wav" \
            -sortformer "$MODELS/diar/model.int8.onnx" -diar-wav "$MODELS/four-speakers-zh.wav" \
            -diar-expect four-speakers-zh.turns \
            "$MODELS/v3-int8" "$MODELS/ultra-int8" 2>&1 | tee "$OUT/probe.log"
          grep -qx PASS "$OUT/probe.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassini-native-${{ matrix.triple }}
          path: |
            /tmp/cassini-native/out/libsherpa-onnx-c-api.dylib
            /tmp/cassini-native/out/libonnxruntime.dylib
            /tmp/cassini-native/out/cassini-native-buildinfo.txt
            /tmp/cassini-native/out/cassini-native-inputs.sha256
            /tmp/cassini-native/out/onnxruntime.sha256
            /tmp/cassini-native/out/otool-L.txt
            /tmp/cassini-native/out/otool-l.txt
            /tmp/cassini-native/out/check.log
            /tmp/cassini-native/out/probe-arm64-build.txt
            /tmp/cassini-native/out/probe.log
          if-no-files-found: warn

  probe-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe-arm64'
    runs-on: ${{ inputs.arm64_runner }}
    timeout-minutes: 60
    env:
      OUT: /tmp/cassini-native/out
      LIB: lib/aarch64-apple-darwin/libsherpa-onnx-c-api.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Check the committed arm64 library
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$OUT"
          if [ -f CASSINI-SHA256SUMS ]; then
            grep aarch64-apple-darwin CASSINI-SHA256SUMS | shasum -a 256 -c -
          fi
          scripts/cassini-check-dylib.sh "$LIB" arm64 11.0 "$RUNTIME_VERSION" 2>&1 | tee "$OUT/check.log"

      - name: Fetch pinned production models and samples
        run: scripts/cassini-fetch-models.sh "$MODELS"

      - name: Probe through the stock Go wrapper
        run: |
          cd scripts/cassini-probe
          CGO_ENABLED=1 go build -buildvcs=false -o "$OUT/cassini-probe" .
          set -o pipefail
          "$OUT/cassini-probe" -wav "$MODELS/en.wav" \
            -sortformer "$MODELS/diar/model.int8.onnx" -diar-wav "$MODELS/four-speakers-zh.wav" \
            -diar-expect four-speakers-zh.turns \
            "$MODELS/v3-int8" "$MODELS/ultra-int8" 2>&1 | tee "$OUT/probe.log"
          grep -qx PASS "$OUT/probe.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassini-probe-arm64
          path: |
            /tmp/cassini-native/out/check.log
            /tmp/cassini-native/out/probe.log
          if-no-files-found: warn
